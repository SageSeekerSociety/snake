spring.application.name=snake.controller
server.port=8080

cheese-auth.jwt-secret=test-secret
cheese-auth.warn-audit-failure=true

application.worker-urls=http://localhost:8081
application.cors.allowed-origins=http://localhost:3000,http://localhost:8080


# Default database configuration
# If you follow README.md and use docker to setup the database, this configuration should work
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:username}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# The following configuration is only used by tests:
cheese-auth.auth-server-url=${CHEESE_AUTH_SERVER_URL:http://localhost:8080}
