services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: .env
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    hostname: minio
    env_file: .env
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${FINAL_PORT}:80
    depends_on:
      backend-controller:
        condition: service_healthy
      cheese-auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost/api/cheese-auth/status && curl -f http://localhost/api/sandbox/status",
        ]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  backend-controller:
    image: ghcr.io/sageseekersociety/snake:${BACKEND_CONTROLLER_TAG:-main}
    env_file: .env
    environment:
      - ROLE=controller
      - WORKER_URLS=http://backend-worker-1:8080,http://backend-worker-2:8080,http://backend-worker-3:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      cheese-auth-database:
        condition: service_healthy
    volumes:
      - ./application-controller.yml:/app/config/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  backend-worker-1:
    image: ghcr.io/sageseekersociety/snake:${BACKEND_WORKER_TAG:-main}
    env_file: .env
    cgroup: host
    volumes:
      - type: volume
        source: backend_worker_data_1
        target: /app/data
      - type: volume
        source: backend_worker_cache_1
        target: /app/cache
      - ./application-worker.yml:/app/config/application.yml:ro
    environment:
      - ROLE=worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    privileged: true

  backend-worker-2:
    image: ghcr.io/sageseekersociety/snake:${BACKEND_WORKER_TAG:-main}
    env_file: .env
    cgroup: host
    volumes:
      - type: volume
        source: backend_worker_data_2
        target: /app/data
      - type: volume
        source: backend_worker_cache_2
        target: /app/cache
      - ./application-worker.yml:/app/config/application.yml:ro
    environment:
      - ROLE=worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    privileged: true

  backend-worker-3:
    image: ghcr.io/sageseekersociety/snake:${BACKEND_WORKER_TAG:-main}
    env_file: .env
    cgroup: host
    volumes:
      - type: volume
        source: backend_worker_data_3
        target: /app/data
      - type: volume
        source: backend_worker_cache_3
        target: /app/cache
      - ./application-worker.yml:/app/config/application.yml:ro
    environment:
      - ROLE=worker
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    privileged: true

  cheese-auth:
    image: ghcr.io/sageseekersociety/cheese-auth:${CHEESE_AUTH_TAG:-main}
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_uploads
        target: /app/uploads
      - ./plugins:/app/server/plugins
    depends_on:
      cheese-auth-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  cheese-auth-database:
    image: postgres:16.2
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_db_pg
        target: /var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

volumes:
  rabbitmq_data:
  minio_data:
  backend_worker_data_1:
  backend_worker_data_2:
  backend_worker_data_3:
  backend_worker_cache_1:
  backend_worker_cache_2:
  backend_worker_cache_3:
  cheese_auth_uploads:
  cheese_auth_db_pg:
