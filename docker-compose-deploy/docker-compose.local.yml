services:
  backend-worker:
    image: my-local-snake-worker:latest
    build:
      context: ..
      dockerfile: ../Dockerfile.worker
      args:
        NSJAIL_REPO: https://github.com/SageSeekerSociety/nsjail.git
        NSJAIL_BRANCH: master
    environment:
      - OTEL_SERVICE_NAME=snake-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
    env_file: ../docker-compose-dependency/.env
    cgroup: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      cheese-auth-database:
        condition: service_healthy
      backend-controller:
        condition: service_healthy
    volumes:
      - type: volume
        source: backend_worker_data
        target: /app/data
      - type: volume
        source: backend_worker_cache
        target: /app/cache
      - ./application-worker.yml:/app/config/application.yml:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    privileged: true

  backend-controller:
    image: my-local-snake-controller:latest
    build:
      context: ..
      dockerfile: ../Dockerfile.controller
    env_file: ../docker-compose-dependency/.env
    environment:
      - OTEL_SERVICE_NAME=snake-controller
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      cheese-auth-database:
        condition: service_healthy
    volumes:
      - type: volume
        source: backend_controller_data
        target: /app/data
      - ./application-controller.yml:/app/config/application.yml:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: ../docker-compose-dependency/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    hostname: minio
    env_file: ../docker-compose-dependency/.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cheese-auth:
    image: ghcr.io/sageseekersociety/cheese-auth:${CHEESE_AUTH_TAG:-main}
    env_file: ../docker-compose-dependency/.env
    environment:
      - PORT=8080
    volumes:
      - type: volume
        source: cheese_auth_uploads
        target: /app/uploads
      - ./plugins:/app/server/plugins
    depends_on:
      cheese-auth-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"

  cheese-auth-database:
    image: postgres:16.2
    env_file: ../docker-compose-dependency/.env
    volumes:
      - type: volume
        source: cheese_auth_db_pg
        target: /var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    ports:
      - "5432:5432"

  # Valkey is a Redis-compatible key-value store
  valkey:
    image: valkey/valkey:8.0.2
    ports:
      - "6379:6379"
    volumes:
      - type: volume
      - source: valkey_data
      - target: /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - backend-controller
      - backend-worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.4
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  rabbitmq_data:
  minio_data:
  valkey_data:
  prometheus_data:
  grafana_data:
  backend_worker_data:
  backend_controller_data:
  backend_worker_cache:
  cheese_auth_uploads:
  cheese_auth_db_pg:

