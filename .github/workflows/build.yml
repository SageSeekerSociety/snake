name: Build Projects

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Start Dependencies for Build
        run: |
          cp docker-compose-dependency/sample.env docker-compose-dependency/.env
          docker compose -f docker-compose-dependency/docker-compose.yml up -d

      - name: Install nsjail for Build
        run: |
          sudo apt-get -y update && sudo apt-get install -y \
            libc6 libstdc++6 libprotobuf32 libnl-route-3-200 autoconf bison flex \
            gcc g++ git libprotobuf-dev libnl-route-3-dev libtool make pkg-config protobuf-compiler
          sudo git clone --depth 1 https://github.com/SageSeekerSociety/nsjail.git /usr/local/src/nsjail
          cd /usr/local/src/nsjail && sudo make -j
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build with Maven
        run: ./mvnw clean install

      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit the changes."
            exit 1
          else
            echo "No uncommitted changes."
          fi

      - name: Upload Controller jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-controller-jar
          path: backend-controller/target/snake.controller-*.jar
          if-no-files-found: error

      - name: Upload Worker jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-worker-jar
          path: backend-worker/target/snake.worker-*.jar
          if-no-files-found: error

      - name: Upload Controller Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-controller-coverage
          path: backend-controller/target/site/jacoco
          if-no-files-found: warn

      - name: Upload Worker Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-worker-coverage
          path: backend-worker/target/site/jacoco
          if-no-files-found: warn

  build-docker-and-test:
    runs-on: ubuntu-latest
    needs: build-jar

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          # Split owner and repo name from github.repository
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          if [ -z "$OWNER" ] || [ -z "$REPO_NAME" ]; then
            echo "Error: Could not parse owner or repo name from github.repository (${{ github.repository }})"
            exit 1
          fi
          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "CONTROLLER_IMAGE_NAME=${OWNER}/snake-controller" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE_NAME=${OWNER}/snake-worker" >> "$GITHUB_ENV"
          echo "NSJAIL_REPO=https://github.com/SageSeekerSociety/nsjail.git" >> "$GITHUB_ENV"
          echo "NSJAIL_REF=master" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta for Controller
        id: meta_controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE_NAME }}

      - name: Docker meta for Worker
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Worker's Jar
        uses: actions/download-artifact@v4
        with:
          name: backend-worker-jar

      - name: Move Worker's Jar
        run: |
          mkdir -p backend-worker/target
          mv *.jar backend-worker/target/snake-worker.jar || echo "Worker JAR move failed/skipped"

      - name: Download Controller's Jar
        uses: actions/download-artifact@v4
        with:
          name: backend-controller-jar

      - name: Move Controller's Jar
        run: |
          mkdir -p backend-controller/target
          mv *.jar backend-controller/target/snake-controller.jar || echo "Controller JAR move failed/skipped"

      - name: Build Controller image for local testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.controller
          load: true
          tags: ${{ env.CONTROLLER_IMAGE_NAME }}:test
          platforms: linux/amd64

      - name: Build Worker image for local testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          load: true
          tags: ${{ env.WORKER_IMAGE_NAME }}:test
          platforms: linux/amd64
          build-args: |
            NSJAIL_REPO=${{ env.NSJAIL_REPO }}
            NSJAIL_BRANCH=${{ env.NSJAIL_REF }}
            CACHE_BUSTER=${{ github.sha }}

      - name: Set up .env file for Docker Compose
        working-directory: docker-compose-deploy
        run: |
          cp sample.env .env
          # Use the environment variables containing the full image path with tag
          echo "CONTROLLER_IMAGE=${{ env.CONTROLLER_IMAGE_NAME }}:test" >> .env
          echo "WORKER_IMAGE=${{ env.WORKER_IMAGE_NAME }}:test" >> .env
          echo ".env file content for compose:"
          cat .env

      - name: Start compose
        working-directory: docker-compose-deploy
        run: |
          # Set safer shell options for robustness
          set -euo pipefail

          # Configurable health check parameters
          MAX_HEALTHCHECK_TRIES=20
          HEALTHCHECK_SLEEP_SECS=5

          # Start services in background
          docker compose --file docker-compose.yml up --no-build --detach

          echo "=== Current Container Status (including exited containers) ==="
          docker compose ps -a

          # Wait for services to stabilize and check their health
          tries=0
          all_healthy=false

          until [ "$all_healthy" = true ] || [ $tries -eq $MAX_HEALTHCHECK_TRIES ]; do
            tries=$((tries+1))
            echo "Waiting for services to become healthy... (try ${tries}/${MAX_HEALTHCHECK_TRIES})"
            docker compose ps -a

            # Check for unexpectedly exited containers (ignore frontend)
            exited_services=$(docker compose ps -a | grep 'Exited' | grep -v 'frontend' | awk '{print $1}' || true)
            if [ -n "$exited_services" ]; then
                echo "=== ERROR: Services have unexpectedly exited: $exited_services ==="
                for service in $exited_services; do
                  echo "===== Logs for exited service: $service ====="
                  docker logs "$service" || echo "Could not get logs for $service"
                done
                exit 1
            fi

            # Count services that have a health status indicator
            services_with_healthcheck=$(docker compose ps -a | grep -c -E '\(healthy\)|\(unhealthy\)|\(health: starting\)' || true)
            healthy_services=$(docker compose ps -a | grep -c '(healthy)' || true)

            echo "Found $healthy_services healthy services out of $services_with_healthcheck services with health checks."

            # Warn about unhealthy services but allow retries
            unhealthy_services=$(docker compose ps -a | grep '(unhealthy)' | awk '{print $1}' || true)
            if [ -n "$unhealthy_services" ]; then
              echo "WARNING: The following services are unhealthy, will retry: $unhealthy_services"
            fi

            # Success condition: at least one service has a health check, and all of them are healthy
            if [ "$services_with_healthcheck" -gt 0 ] && [ "$healthy_services" -eq "$services_with_healthcheck" ]; then
              all_healthy=true
            elif [ $tries -lt $MAX_HEALTHCHECK_TRIES ]; then
              sleep $HEALTHCHECK_SLEEP_SECS
            fi
          done

          if [ "$all_healthy" = false ]; then
            echo "=== ERROR: Services did not become healthy after $MAX_HEALTHCHECK_TRIES tries ==="
            docker compose ps -a
            
            # Get all services that are not healthy or are not the frontend service that is expected to exit
            failing_services=$(docker compose ps -a | grep -v -E '\(healthy\)|frontend.*Exited' | awk 'NR>1 {print $1}')
            
            if [ -n "$failing_services" ]; then
              echo "=== Logs for failing or unhealthy services ==="
              for service in $failing_services; do
                echo "===== Logs for service: $service ====="
                docker logs "$service" || echo "Could not get logs for $service"
              done
            fi
            
            exit 1
          fi

          echo "All services are healthy!"
          docker compose ps

      - name: Build and push Controller multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.controller
          push: true
          tags: ${{ steps.meta_controller.outputs.tags }}
          labels: ${{ steps.meta_controller.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm64/v8
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker amd64 image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NSJAIL_REPO=${{ env.NSJAIL_REPO }}
            NSJAIL_BRANCH=${{ env.NSJAIL_REF }}
            CACHE_BUSTER=${{ github.sha }}
