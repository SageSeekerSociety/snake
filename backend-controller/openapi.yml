openapi: 3.0.0
info:
  title: API
  version: 1.0.0
paths:
  /submit:
    post:
      summary: Submit source code
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - src
              properties:
                src:
                  type: string
                  format: binary
                  description: Source code file
      responses:
        '200':
          description: Submission successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - success
                      - diagnose
                    properties:
                      success:
                        type: boolean
                      diagnose:
                        type: string
  /exec:
    post:
      summary: Execute code in sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userIds
                - input
              properties:
                userIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Array of user IDs
                input:
                  type: string
                  description: Input for the execution
      responses:
        '200':
          description: Execution successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - output
                        - sandbox
                      properties:
                        userId:
                          type: integer
                          format: int64
                        output:
                          type: string
                        sandbox:
                          type: string
                        error:
                          type: object
  /status:
    get:
      summary: Check service status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: integer
                  message:
                    type: string
