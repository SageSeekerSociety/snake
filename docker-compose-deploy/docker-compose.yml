services:
  backend-worker:
    image: ghcr.io/sageseekersociety/snake:${BACKEND_WORKER_TAG:-main}
    env_file: .env
    volumes:
      - type: volume
        source: backend_worker_data
        target: /app/data
    environment:
      - PORT=${BACKEND_WORKER_PORT}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_WORKER_PORT}/status || exit 1"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    ports:
      - "${BACKEND_WORKER_PORT}:${BACKEND_WORKER_PORT}"
    privileged: true

  cheese-auth:
    image: ghcr.io/sageseekersociety/cheese-auth:${CHEESE_AUTH_TAG:-main}
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_uploads
        target: /app/uploads
    environment:
      - PORT=${CHEESE_AUTH_PORT}
    depends_on:
      cheese-auth-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CHEESE_AUTH_PORT}/status || exit 1"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    ports:
      - "${CHEESE_AUTH_PORT}:${CHEESE_AUTH_PORT}"

  cheese-auth-database:
    image: postgres:16.2
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_db_pg
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
  
volumes:
  backend_worker_data:
  cheese_auth_uploads:
  cheese_auth_db_pg:
