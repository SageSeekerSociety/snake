name: Build Projects

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-jar:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: ["backend-controller", "backend-worker"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Start Dependencies
        run: |
          cp sample.env .env
          docker compose -f docker-compose.yml up -d

      - name: Install nsjail
        run: |
          sudo apt-get -y update && sudo apt-get install -y \
            libc6 \
            libstdc++6 \
            libprotobuf32 \
            libnl-route-3-200 \
            autoconf \
            bison \
            flex \
            gcc \
            g++ \
            git \
            libprotobuf-dev \
            libnl-route-3-dev \
            libtool \
            make \
            pkg-config \
            protobuf-compiler
          sudo git clone --depth 1 https://github.com/google/nsjail.git /usr/local/src/nsjail
          cd /usr/local/src/nsjail
          sudo make -j

          # See: https://github.com/google/nsjail/issues/236
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build with Maven
        working-directory: ${{ matrix.project }}
        run: ./mvnw install

      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit the changes."
            exit 1
          else
            echo "No uncommitted changes."
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: ${{ matrix.project }}/target/*.jar

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-coverage
          path: ${{ matrix.project }}/target/site/jacoco

  build-docker:
    runs-on: ubuntu-latest

    needs: build-jar

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=SageSeekerSociety/snake" >> "$GITHUB_ENV"

      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Jar
        uses: actions/download-artifact@v4
        with:
          name: backend-worker-jar

      - name: Move Jar
        run: |
          mkdir backend-worker/target || true
          mv *.jar backend-worker/target/

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend-worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
