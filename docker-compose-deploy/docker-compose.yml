services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: .env
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    hostname: minio
    env_file: .env
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:latest
    env_file: .env
    ports:
      - "6379:6379"
    volumes:
      - type: volume
        source: valkey_data
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/sageseekersociety/snake-frontend:${FRONTEND_TAG:-main}}
    env_file: .env
    command: sh -c 'cp -r /usr/share/nginx/html/. /mnt/dist/ && echo "Frontend files copied successfully."'
    volumes:
      - frontend_dist:/mnt/dist/

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - ${FINAL_PORT}:80
    depends_on:
      backend-controller:
        condition: service_healthy
      cheese-auth:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost/ && curl -f http://localhost/api/cheese-auth/status && curl -f http://localhost/api/sandbox/actuator/health",
        ]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  backend-controller:
    image: ${CONTROLLER_IMAGE:-ghcr.io/sageseekersociety/snake-controller:${BACKEND_CONTROLLER_TAG:-main}}
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=snake-controller
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
      cheese-auth-database:
        condition: service_healthy
    volumes:
      - ./application-controller.yml:/app/config/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  backend-worker:
    image: ${WORKER_IMAGE:-ghcr.io/sageseekersociety/snake-worker:${BACKEND_WORKER_TAG:-main}}
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=snake-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
    cgroup: host
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      cheese-auth-database:
        condition: service_healthy
      backend-controller:
        condition: service_healthy
    volumes:
      - type: volume
        source: backend_worker_data
        target: /app/data
      - type: volume
        source: backend_worker_cache
        target: /app/cache
      - ./application-worker.yml:/app/config/application.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3
    privileged: true

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - backend-controller
      - backend-worker
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.4
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  cheese-auth:
    image: ${CHEESE_AUTH_IMAGE:-ghcr.io/sageseekersociety/cheese-auth:${CHEESE_AUTH_TAG:-main}}
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_uploads
        target: /app/uploads
      - ./plugins:/app/server/plugins
    depends_on:
      cheese-auth-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  cheese-auth-database:
    image: postgres:16.2
    env_file: .env
    volumes:
      - type: volume
        source: cheese_auth_db_pg
        target: /var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 180s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

volumes:
  rabbitmq_data:
  minio_data:
  valkey_data:
  prometheus_data:
  grafana_data:
  backend_worker_data:
  backend_worker_cache:
  cheese_auth_uploads:
  cheese_auth_db_pg:
  frontend_dist: