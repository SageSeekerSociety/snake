server {
    listen 80;
    server_name localhost;

    location ~ ^/api/sandbox/(compile|execute)/stream {
        rewrite ^/api/sandbox/(.*) /$1 break;
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 24h;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        add_header 'X-Accel-Buffering' 'no';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend-controller:8080;
    }

    location /api/cheese-auth {
        rewrite ^/api/cheese-auth/(.*) /$1 break;
        proxy_pass http://cheese-auth:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
    }

    location /api/sandbox {
        rewrite ^/api/sandbox/(.*) /$1 break;
        proxy_pass http://backend-controller:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
