name: Build Projects

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Start Dependencies
        run: |
          cp docker-compose-dependency/sample.env docker-compose-dependency/.env
          docker compose -f docker-compose-dependency/docker-compose.yml up -d

      - name: Install nsjail
        run: |
          sudo apt-get -y update && sudo apt-get install -y \
            libc6 \
            libstdc++6 \
            libprotobuf32 \
            libnl-route-3-200 \
            autoconf \
            bison \
            flex \
            gcc \
            g++ \
            git \
            libprotobuf-dev \
            libnl-route-3-dev \
            libtool \
            make \
            pkg-config \
            protobuf-compiler
          sudo git clone --depth 1 https://github.com/SageSeekerSociety/nsjail.git /usr/local/src/nsjail
          cd /usr/local/src/nsjail
          sudo make -j

          # See: https://github.com/google/nsjail/issues/236
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build with Maven
        run: ./mvnw clean install

      - name: Check uncommitted changes to ensure format applied
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git status
            echo "There are uncommitted changes. Please run './mvnw spotless:apply' and commit the changes."
            exit 1
          else
            echo "No uncommitted changes."
          fi

      - name: Upload Controller jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-controller-jar
          path: backend-controller/target/snake.controller-*.jar
          if-no-files-found: error

      - name: Upload Worker jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-worker-jar
          path: backend-worker/target/snake.worker-*.jar
          if-no-files-found: error

      - name: Upload Controller coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-controller-coverage
          path: backend-controller/target/site/jacoco
          if-no-files-found: warn

      - name: Upload Worker coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-worker-coverage
          path: backend-worker/target/site/jacoco
          if-no-files-found: warn

  build-docker:
    runs-on: ubuntu-latest
    needs: build-jar

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          # Split owner and repo name from github.repository
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          if [ -z "$OWNER" ] || [ -z "$REPO_NAME" ]; then
            echo "Error: Could not parse owner or repo name from github.repository (${{ github.repository }})"
            exit 1
          fi
          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "CONTROLLER_IMAGE_NAME=${OWNER}/snake-controller" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE_NAME=${OWNER}/snake-worker" >> "$GITHUB_ENV"
          echo "NSJAIL_REPO=https://github.com/SageSeekerSociety/nsjail.git" >> "$GITHUB_ENV"
          echo "NSJAIL_REF=master" >> "$GITHUB_ENV"

      - name: Login to docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta for Controller
        id: meta_controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONTROLLER_IMAGE_NAME }}

      - name: Docker meta for Worker
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Worker's Jar
        uses: actions/download-artifact@v5
        with:
          name: backend-worker-jar

      - name: Move Worker's Jar
        run: |
          mkdir -p backend-worker/target
          mv *.jar backend-worker/target/snake-worker.jar || echo "Worker JAR move failed/skipped"

      - name: Download Controller's Jar
        uses: actions/download-artifact@v5
        with:
          name: backend-controller-jar

      - name: Move Controller's Jar
        run: |
          mkdir -p backend-controller/target
          mv *.jar backend-controller/target/snake-controller.jar || echo "Controller JAR move failed/skipped"

      # --- Build Controller Image ---
      - name: Build and push Controller image
        id: build_controller
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ./Dockerfile.controller
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta_controller.outputs.tags }}
          labels: ${{ steps.meta_controller.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # --- Build Worker Image ---
      - name: Build and push Worker image
        id: build_worker
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: ./Dockerfile.worker
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          build-args: |
            NSJAIL_REPO=${{ env.NSJAIL_REPO }}
            NSJAIL_BRANCH=${{ env.NSJAIL_REF }}
            CACHE_BUSTER=${{ github.sha }}

      - name: Set Image Names with Determined Tag
        run: |
          CONTROLLER_IMAGE_TAG="${{ steps.meta_controller.outputs.version }}"
          WORKER_IMAGE_TAG="${{ steps.meta_worker.outputs.version }}"
          echo "CONTROLLER_IMAGE=${REGISTRY}/${CONTROLLER_IMAGE_NAME}:${CONTROLLER_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${REGISTRY}/${WORKER_IMAGE_NAME}:${WORKER_IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Debug Image Variables
        run: |
          echo "Controller Image Resolved: ${{ env.CONTROLLER_IMAGE }}"
          echo "Worker Image Resolved: ${{ env.WORKER_IMAGE }}"

      - name: Create env file
        working-directory: docker-compose-deploy
        run: cp sample.env .env

      - name: Set image tags in .env file
        working-directory: docker-compose-deploy
        run: |
          # Use the environment variables containing the full image path with tag
          echo "CONTROLLER_IMAGE=${{ env.CONTROLLER_IMAGE }}" >> .env
          echo "WORKER_IMAGE=${{ env.WORKER_IMAGE }}" >> .env
          echo ".env file content for compose:"
          cat .env

      - name: Start compose
        working-directory: docker-compose-deploy
        run: |
          # Start services in background
          docker compose --file docker-compose.yml up --no-build --detach || true

          echo "=== Current Container Status (including exited containers) ==="
          docker compose ps -a

          # Check if any containers failed to start or exited
          failed_containers=$(docker compose ps -a | grep -E "Exit|exited" | awk '{print $1}')

          if [ -n "$failed_containers" ]; then
            echo "=== CRITICAL ERROR: The following containers failed to start ==="
            echo "$failed_containers"
            
            echo "=== Environment Variables ==="
            docker compose config | grep -v -E '^\s*(password|secret|key)'
            
            echo "=== Failed Container Details ==="
            for container in $failed_containers; do
              echo "===== Failed Container: $container ====="
              docker inspect $container | grep -E 'State|ExitCode|Error|Cmd|Args|Env'
              echo ""
              echo "===== Logs for $container ====="
              docker logs $container 2>&1 || echo "Could not get logs for $container"
            done
            
            # Check controller specifically since that's what's failing
            controller_container=$(echo "$failed_containers" | grep "controller")
            if [ -n "$controller_container" ]; then
              echo "===== Controller Container Environment Variables ====="
              docker inspect $controller_container -f '{{range .Config.Env}}{{println .}}{{end}}'
              
              echo "===== Controller Container Command ====="
              docker inspect $controller_container -f '{{.Config.Cmd}}'
              
              echo "===== Controller Container Entry Point ====="
              docker inspect $controller_container -f '{{.Config.Entrypoint}}'
            fi
            
            # Still output logs for any running containers
            echo "=== Running Service Logs ==="
            running_containers=$(docker compose ps -q)
            for container in $running_containers; do
              container_name=$(docker inspect --format='{{.Name}}' $container | sed 's/\///')
              echo "===== Logs for running container $container_name ====="
              docker logs $container 2>&1 || echo "Could not get logs for $container_name"
            done
            
            exit 1
          fi

          # Check health of running containers
          max_tries=10
          tries=0
          until [ $(docker compose ps | grep -c 'healthy') -eq \
              $(docker compose ps -q | wc -l) ] || [ $tries -eq $max_tries ]; do
            echo "Waiting for all services to become healthy... (try $((tries+1))/$max_tries)"
            docker compose ps
            sleep 5
            tries=$((tries+1))
          done

          if [ $tries -eq $max_tries ]; then
            echo "=== ERROR: Services did not become healthy after $max_tries tries ==="
            
            # Add all previous diagnostic code here...
            # [previous diagnostic code]
            
            exit 1
          fi

          echo "All services are healthy!"
          docker compose ps
