spring:
  application:
    name: snake.controller
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydb}?currentSchema=${DB_SCHEMA:public}
    username: ${DB_USERNAME:username}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: your-password # Uncomment and set if your Redis has a password
      # timeout: 60000 # Connection timeout
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
  web:
    resources:
      add-mappings: false

server:
  port: 8080
  forward-headers-strategy: native

# --- Actuator 配置 ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized

otel:
  service:
    name: ${spring.application.name}
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

cheese-auth:
  jwt-secret: ${JWT_SECRET:test-secret}
  warn-audit-failure: true
  auth-server-url: ${CHEESE_AUTH_SERVER_URL:http://localhost:8080}

application:
  cors:
    allowed-origins:
      - http://localhost:3000

# --- AMQP (RabbitMQ) 配置 ---
amqp:
  queue:
    compile: oj.compile.tasks    # 编译任务队列名
    execute: oj.execute.tasks    # 执行任务队列名
    # compile-dlq: oj.compile.tasks.dlq # (可选) 死信队列
    # execute-dlq: oj.execute.tasks.dlq # (可选) 死信队列
    # results: oj.results.notify        # (可选) 结果通知队列
  exchange:
    requests: oj.requests.exchange # 请求交换机
    results: oj.results.exchange   # (可选) 结果交换机
    # requests-dlx: oj.requests.exchange.dlx # (可选) 死信交换机
  routingkey:
    compile: task.compile         # 路由键
    execute: task.execute         # 路由键
    result: result.notify         # (可选) 结果路由键
    # compile-dlq: task.compile.dlq # (可选) 死信路由键
    # execute-dlq: task.execute.dlq # (可选) 死信路由键
  listener:
    prefetch: 10

# --- MinIO 配置 ---
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET_NAME:oj-programs}

# ===============================================
# Rate Limiter Configuration
# ===============================================
rate-limiter:
  # 定义所有可用的限流策略
  policies:

    compilation:
      capacity: 10                    # 桶容量/突发容量: 10
      refill-rate: 10                 # 补充速率: 10
      refill-period: 1                # 补充周期: 1
      refill-unit: MINUTES            # 补充单位: 分钟
      key-expression: "'compilation:' + #userId" # Redis Key表达式
      tokens-expression: "1"        # 每次请求固定消耗1个令牌

    execution-jobs:
      capacity: 800                   # 桶容量/突发容量: 800 jobs
      refill-rate: 400                # 补充速率: 400 jobs
      refill-period: 1                # 补充周期: 1
      refill-unit: SECONDS            # 补充单位: 秒
      key-expression: "'execution_jobs:' + #userId" # Redis Key表达式
      tokens-expression: "#requests.size()" # 消耗的令牌数 = 请求体中requests列表的大小

    execution-frequency:
      capacity: 100                   # 桶容量/突发容量: 100 requests
      refill-rate: 50                 # 补充速率: 50 requests
      refill-period: 1                # 补充周期: 1
      refill-unit: SECONDS            # 补充单位: 秒
      key-expression: "'execution_freq:' + #userId" # Redis Key表达式
      tokens-expression: "1"        # 每次请求固定消耗1个令牌

# ===============================================
# Submission Policy
# ===============================================
submission-policy:
  # 系统截止提交时间（ISO-8601，含时区）。到点后禁止提交编译/执行请求。
  # 当前配置：2025-09-03 北京时间 13:00 关闭
  system-close-at: "2025-09-03T13:00:00+08:00"
  # 允许提交执行请求的用户ID白名单（按提交者校验；被执行的程序所有者不受限制）
  # 为空表示不启用白名单限制
  execute-submit-whitelist: []
  # 单次批量执行请求的最大 items 数（超过则返回 400）
  execute-batch-max-size: 30
