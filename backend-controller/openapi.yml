openapi: 3.0.0
info:
  title: API
  version: 1.0.0
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户 ID
          minimum: 1
        username:
          type: string
          description: 用户名
          example: "cheese"
        nickname:
          type: string
          description: 昵称
          example: "芝士"
        avatarId:
          type: integer
          format: int64
          description: 头像 id
        intro:
          type: string
          description: 个人简介
          default: "This user has not set an introduction yet."
      required:
        - id
        - username
        - nickname
        - avatarId
        - intro
paths:
  /submit:
    post:
      summary: Submit source code
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - src
              properties:
                src:
                  type: string
                  format: binary
                  description: Source code file
      responses:
        '200':
          description: Submission successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - success
                      - diagnose
                    properties:
                      success:
                        type: boolean
                      diagnose:
                        type: string
  /exec:
    post:
      summary: Execute code in sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userIds
                - input
              properties:
                userIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Array of user IDs
                input:
                  type: string
                  description: Input for the execution
      responses:
        '200':
          description: Execution successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - userId
                        - output
                        - sandbox
                      properties:
                        userId:
                          type: integer
                          format: int64
                        output:
                          type: string
                        sandbox:
                          type: string
                        error:
                          type: object
  /status:
    get:
      summary: Check service status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: integer
                  message:
                    type: string
  /submitters:
    get:
      summary: Get all submitters
      responses:
        '200':
          description: Successfully retrieved all submitters
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                    required:
                      - users
  /compile/export/latest-sources.zip:
    get:
      summary: Export latest successful source per user as ZIP
      responses:
        '200':
          description: ZIP stream
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden (not in admin whitelist)
